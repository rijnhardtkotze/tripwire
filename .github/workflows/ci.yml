name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Detect tests
        id: detect-tests
        shell: bash
        run: |
          has_tests=false

          if find tests -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            has_tests=true
          elif find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            has_tests=true
          fi

          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.detect-tests.outputs.has_tests == 'true'
        run: uv run --with pytest pytest
