name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Detect tests
        id: detect-tests
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          excluded_dirs = {".git", ".venv", "node_modules", "__pycache__"}
          has_tests = False

          for path in Path(".").rglob("*.py"):
              if excluded_dirs.intersection(path.parts):
                  continue
              if "tests" in path.parts or path.name.startswith("test_") or path.name.endswith("_test.py"):
                  has_tests = True
                  break

          print(f"has_tests={'true' if has_tests else 'false'}")
          PY

      - name: Run tests
        if: steps.detect-tests.outputs.has_tests == 'true'
        run: uv run --with pytest pytest
